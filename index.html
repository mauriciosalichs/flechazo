<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff3d6e">
<title>Flechazo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d6e"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient></defs></svg>

<div id="stage"><div id="phone">

  <!-- splash -->
  <section class="screen on" id="splash">
    <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>flechazo</div>
    <p class="t">Conoce gente cerca de ti.</p>
    <button class="btn" id="goBtn">Empezar</button>
  </section>

  <!-- setup -->
  <section class="screen" id="setup">
    <h2>Crea tu perfil</h2>
    <p>Para que las personas adecuadas te encuentren. Solo se queda en tu dispositivo.</p>
    <label for="inName">Tu nombre</label>
    <input id="inName" maxlength="20" autocomplete="off" placeholder="¿Cómo te llamas?">
    <label for="inCity">Tu ciudad</label>
    <input id="inCity" maxlength="26" autocomplete="off" placeholder="¿Dónde vives?">
    <div class="sp"></div>
    <button class="btn g" id="setBtn">Continuar</button>
    <button class="skip" id="skipBtn">Omitir por ahora</button>
  </section>

  <!-- searching -->
  <section class="screen" id="search">
    <div class="rad"><i></i><i></i><i></i><b class="grad"><svg class="i" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></b></div>
    <p>Buscando chicos cerca de ti…</p>
  </section>

  <!-- swipe -->
  <section class="screen" id="sw">
    <div class="top">
      <div class="logo" id="logo"><svg class="i" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="gtext">flechazo</span></div>
      <div class="tic" id="tic">
        <button id="bSet" aria-label="Ajustes"><svg class="i" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
        <button data-t="bell"><svg class="i" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-2l-2-2z"/></svg></button>
      </div>
    </div>
    <div id="settings">
      <div class="sh"><button id="setBack" aria-label="Volver"><svg class="i" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button><b>Ajustes</b></div>
      <div id="setList"></div>
    </div>
    <div id="deck"></div>
    <div id="acts">
      <button class="ab s rew" id="bRew" aria-label="Deshacer"><svg class="i" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
      <button class="ab nope" id="bNope" aria-label="No"><svg class="i" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      <button class="ab s sup" id="bSup" aria-label="Super like"><svg class="i" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
      <button class="ab like" id="bLike" aria-label="Sí"><svg class="i" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
      <button class="ab s bst" id="bBst" aria-label="Boost"><svg class="i" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg></button>
    </div>
    <nav id="tabs">
      <button class="on" data-t="cards"><svg class="i" viewBox="0 0 24 24"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67z"/></svg>Explorar</button>
      <button data-t="likes"><svg class="i" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>Likes</button>
      <button data-t="msgs"><svg class="i" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Mensajes<span class="bd" id="bd">1</span></button>
      <button data-t="me"><svg class="i" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Perfil</button>
    </nav>
    <div id="toasts"></div>
  </section>

  <!-- match -->
  <section class="screen" id="match">
    <h1>¡Es un match!</h1>
    <p id="mSub">A ti y a Mauricio os gustáis.</p>
    <div class="pp"><div><svg class="i" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><div id="mPic"></div></div>
    <p id="mTxt" style="opacity:.9;font-size:15px"></p>
  </section>

  <!-- chat -->
  <section class="screen" id="chat">
    <div class="hd">
      <button id="cBack" aria-label="Volver"><svg class="i" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
      <img class="av" id="hAv" alt="">
      <div class="who"><b>Mauricio</b><small id="hSt">en línea</small></div>
      <button id="cMenu" aria-label="Opciones"><svg class="i" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
    </div>
    <div id="msgs"><div id="typing"><i></i><i></i><i></i></div></div>
    <div id="comp">
      <form id="cIn" class="on" autocomplete="off"><input id="cText" placeholder="Escribe un mensaje…" maxlength="140"><button class="grad" type="submit" aria-label="Enviar"><svg class="i" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button></form>
      <div id="cChips"></div>
      <div id="cLocked"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>No puedes responder a este chat</div>
      <div id="cDoor"><button id="doorBtn">Abrir la puerta</button></div>
    </div>
    <div id="sheet"><div><button id="shRep">Reportar a Mauricio</button><button class="d" id="shBlk">Bloquear a Mauricio</button><button id="shCan">Cancelar</button></div></div>
  </section>

  <!-- alert -->
  <div id="alert"><div class="bx"><h4 id="alT"></h4><p id="alP"></p><div class="bt" id="alB"></div></div></div>
</div></div>

<div id="vig"></div><div id="grain"></div><div id="sub"></div><div id="lights"></div>
<div id="notifs"></div>
<div id="scream"><img id="scImg" alt=""></div>
<div id="black"><button id="again">La experiencia ha terminado. Toca para volver a empezar.</button></div>

<script src="js/images.js"></script>
<script src="js/helpers.js"></script>
<script src="js/audio.js"></script>
<script src="js/content.js"></script>
<script src="js/fx.js"></script>
<script src="js/deck.js"></script>
<script src="js/chat.js"></script>
<script src="js/finale.js"></script>
<script src="js/main.js"></script>
</body>
</html>
